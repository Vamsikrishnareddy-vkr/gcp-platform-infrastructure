apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-platform-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gcp-platform-app

  template:
    metadata:
      labels:
        app: gcp-platform-app

    spec:
      containers:
        - name: gcp-platform-app
          image: YOUR_ARTIFACT_REGISTRY_IMAGE

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"